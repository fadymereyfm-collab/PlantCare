# includeAndroidResources (needed by the screenshot tests) makes Robolectric
# read the merged manifest. Keep the previous effective test setup:
# - Pinned to API 34 (the SDK the screenshot baselines were recorded on);
#   the app targets 35.
sdk=34
# - Plain Application: the real App.onCreate() schedules WorkManager jobs
#   and initializes Ads/Firebase, which crashes under Robolectric.
application=android.app.Application
