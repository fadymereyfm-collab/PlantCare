plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.fadymerey.plantcare.macrobenchmark'
    compileSdk 35

    defaultConfig {
        minSdk 28   // Baseline Profiles require API 28+
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Points to the app module that will receive the generated profile
    targetProjectPath ':app'

    // Match the app's product flavors so the generator can target each variant
    flavorDimensions "environment"
    productFlavors {
        dev  { dimension "environment" }
        prod { dimension "environment" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.test:runner:1.5.2'
    implementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.2.4'
}
