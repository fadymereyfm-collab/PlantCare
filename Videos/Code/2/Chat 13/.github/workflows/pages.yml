# ──────────────────────────────────────────────────────────────
# PlantCare — GitHub Pages Deployment
#
# Deploys docs/index.html to:
#   https://fadymereyfm-collab.github.io/PlantCare/
#
# One-time setup required in GitHub:
#   Settings → Pages → Source → "GitHub Actions"
#   (only needs to be done once via the GitHub UI)
#
# Triggers on every push to main that touches docs/
# ──────────────────────────────────────────────────────────────

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
